[project]
name = "send-to-kindle-mcp"
version = "0.1.0"
description = "MCP server to send documents to Kindle e-readers"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "ebooklib>=0.18",
    "markdown>=3.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']
